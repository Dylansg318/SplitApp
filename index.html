<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The build is location-agnostic (base: './'), so every asset URL is
         relative to THIS document. A host that serves /demos/receipt-splitter/
         as /demos/receipt-splitter (Cloudflare's drop-trailing-slash does)
         would resolve ./assets/ one directory up. Pin the base to this
         document's own directory before any URL is resolved. Runs first, and
         is a classic script, so the module script below sees the base. -->
    <script>
      (function () {
        var p = location.pathname;
        if (!/\/$/.test(p) && !/\.html?$/i.test(p)) {
          var b = document.createElement('base');
          b.href = p + '/';
          document.head.appendChild(b);
        }
      })();
    </script>
    <!-- No apple-mobile-web-app-capable, on purpose: WebKit bug 185448 breaks
         getUserMedia in standalone mode. A home-screen icon must open in Safari. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="Photograph a receipt, say who had what, get the split. Nothing leaves your phone." />
    <title>Receipt Splitter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='2' fill='%23f4f1ea'/%3E%3Cpath d='M10 9h12M10 14h12M10 19h8' stroke='%23222' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
